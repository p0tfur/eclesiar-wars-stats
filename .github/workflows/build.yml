name: Build Wars

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            **/package-lock.json

      - name: Install backend deps
        working-directory: backend
        run: npm ci --omit=dev

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ghcr.io/p0tfur/eclesiar-wars-stats:latest

      - name: Trigger Coolify deployment
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          if [ -z "${{ secrets.COOLIFY_WEBHOOK }}" ] || [ -z "${{ secrets.COOLIFY_TOKEN_ECLEWARS }}" ]; then
            echo "Missing COOLIFY_WEBHOOK or COOLIFY_TOKEN_ECLEWARS secret" >&2
            exit 1
          fi
          curl --fail --show-error --silent --request GET "${{ secrets.COOLIFY_WEBHOOK }}" \
            --header "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN_ECLEWARS }}"
